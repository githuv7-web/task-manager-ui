<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarea - Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-centrada">

   
    <header>
        <nav>
            <h1>Task Manager</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="crear-tarea.html">Nueva Tarea</a></li>
                <li><a href="login.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    
  <main class="contenedor-form">
    <section>
        <h2>Crear Nueva Tarea</h2>
        <p>Rellene el formulario para registrar una nueva actividad.</p>
        <form>
            <div class="campo">
                <label for="titulo">Titulo de la tarea</label>
                <input 
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Ej: Diseñar el logo" >
            </div>
            <div class="campo">
                <label for="descripcion">Descripcion</label>
                <textarea id="descripcion"
                name="descripcion"
                rows="4"
                placeholder="Describe el que consiste la tarea..."></textarea>
                <div class="campo">
                    <label for="fecha">Fecha limite</label>
                    <input type="date"
                    id="fecha"
                    name="fecha">
                </div>
                 <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="pendiente">Pendiente</option>
                        <option value="en-progreso">En progreso</option>
                        <option value="completado">Completado</option>
                    </select>
                </div>

               <div class="botones">
                    <button type="submit">Guardar Tarea</button>
                    <a href="index.html">Cancelar</a>
                </div>

                
            </div>
        </form>
    </section>
  </main>

  
    <footer>
        <p>Task Manager © 2026 - SENA</p>
    </footer>

</body>
</html>
