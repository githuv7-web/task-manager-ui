<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-centrada">

  
    <header>
        <nav>
            <h1>Task Manager</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>


    <main class="contenedor-form">
        <section>
            <h2>Crear Cuenta</h2>
            <p>Rellena el formulario para registrarte</p>

            <form>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Ej: Juan Pérez"
                    >
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="correo" 
                        name="correo" 
                        placeholder="ejemplo@correo.com"
                    >
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input 
                        type="password" 
                        id="contrasena" 
                        name="contrasena" 
                        placeholder="Mínimo 8 caracteres"
                    >
                </div>

                <div class="campo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input 
                        type="password" 
                        id="confirmar" 
                        name="confirmar" 
                        placeholder="Repite tu contraseña"
                    >
                </div>

                <button type="submit">Registrarse</button>

                <p>¿Ya tienes cuenta? 
                    <a href="login.html">Inicia sesión aquí</a>
                </p>
            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Task Manager © 2026 - SENA</p>
    </footer>

</body>
</html>
